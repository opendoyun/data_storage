<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>앨범 실험실</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/album.css">
<style>
  .lab{max-width:1120px;margin:0 auto;padding:16px}
  .lab h1{font-size:20px;margin:4px 0 2px}
  .lab .lab-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
  .lab .lab-bar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  .lab .lab-bar button.on{border-color:var(--gold);color:var(--gold)}
  .lab .grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:900px){.lab .grid2{grid-template-columns:1fr}}
  .lab code{word-break:break-all}
  .lab pre{background:#0e0a1b;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
  .lab .narrow{max-width:380px}
</style>
</head>
<body>
<div class="lab">
  <h1>앨범 실험실</h1>
  <div class="hint">메타 진행(GDD 4.9)과 엔딩 앨범을 가짜 회차 기록으로 확인하는 개발용 페이지. 저장은 메모리에만 한다(실제 게임 기록과 섞이지 않음).
    주소 뒤에 <code>?scenario=empty|few|many&amp;letters=demo|data&amp;tab=album|letters|runs|shop</code></div>
  <div class="lab-bar" id="bar">
    <button data-sc="empty">첫 플레이(빈 기록)</button>
    <button data-sc="few">기록 3회</button>
    <button data-sc="many">기록 24회</button>
    <span class="sep"></span>
    <button id="b-letters">편지: 데모</button>
    <button id="b-engine">실제 엔진으로 1판 기록</button>
    <button id="b-corrupt">손상된 저장 불러오기</button>
  </div>
  <div class="panel" id="album"></div>
  <div class="grid2">
    <div class="panel"><h2>새 게임 추가 선택</h2><div id="extras"></div></div>
    <div class="panel"><h2>newGameOptions 결과</h2><pre id="opts"></pre>
      <h2 style="margin-top:14px">마지막 recordRun 결과</h2><pre id="last">-</pre></div>
  </div>
  <div class="panel narrow" style="margin-top:16px"><h2>성격 지도 (좁은 폭 340px)</h2><div id="pm-narrow"></div></div>
</div>
<script type="module">
import * as M from '../js/engine/meta.js';
import { renderAlbum, renderNewGameExtras, renderPersonalityMap, CAT_ORDER } from '../js/ui/album.js';
import { ENDINGS } from '../js/data/endings.js';
import { LETTERS, CATEGORY_LETTERS } from '../js/data/letters.js';
import { STATS, PERSONALITY } from '../js/data/stats.js';

const q = new URLSearchParams(location.search);
// ── 메모리 저장소 (loadMeta/saveMeta 경로를 그대로 탄다)
const mem = new Map();
const storage = { getItem: k => (mem.has(k) ? mem.get(k) : null), setItem: (k, v) => mem.set(k, String(v)), removeItem: k => mem.delete(k) };

// ── 데모 편지: 실제 편지 데이터가 비어 있을 때 화면 확인용 (게임에는 쓰이지 않음)
const DEMO = [
  { title: '잘 도착했어', text: '{call}에게.\n\n잘 도착했어. 여기는 우리 집 창문보다 하늘이 조금 좁아. 그래도 밤이 되면 달이 세 개 다 보여서, 나는 그걸 보고 집 쪽을 짐작해.\n\n밥 거르지 마. 큐브한테도 안부 전해 줘.\n\n{name}' },
  { title: '첫 겨울', text: '{call}에게.\n\n여기도 눈이 와. 혼자 나는 첫 겨울이라 그런지, 난로 앞에서 {call이} 담요를 덮어 주던 게 자꾸 생각나.\n\n자주 못 써서 미안해. 그래도 매일 생각은 해.\n\n{name}' },
  { title: '다음 봄에는', text: '{call}에게.\n\n다음 봄에는 집에 갈게. 들판에 꽃이 피면, 그때처럼 같이 걷자. 이번엔 내가 길을 안내할게.\n\n나는 잘 지내. 정말이야. {call}도 그래야 해.\n\n{name}' },
];
const DEMO_CAT = Object.fromEntries(CAT_ORDER.map(c => [c, DEMO]));
const realLetterCount = Object.values(LETTERS).reduce((a, l) => a + (l?.length || 0), 0) + Object.values(CATEGORY_LETTERS).reduce((a, l) => a + (l?.length || 0), 0);
let lettersMode = q.get('letters') || (realLetterCount ? 'data' : 'demo');
const src = () => lettersMode === 'demo' ? { letters: {}, categoryLetters: DEMO_CAT } : {};

// ── 결정적 가짜 최종 상태
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const NAMES = ['루나', '하린', '세라', '미르', '아린', '다온', '별', '유나', '소린', '이솔', '단비', '가을'];
const GUARDS = ['knight', 'scholar', 'knight', 'merchant', 'scholar', 'priest', 'merchant', 'adventurer'];
function fakeFinal(i, def) {
  const r = rng(1009 + i * 7919);
  const stats = Object.fromEntries(STATS.map(s => [s.id, Math.round(60 + r() * 180)]));
  for (const [k, w] of Object.entries(def.weights || {})) stats[k] = clamp(Math.round(stats[k] + 320 * w + r() * 160), 0, 999);
  let p = Object.fromEntries(PERSONALITY.map(ax => [ax.id, Math.round((r() - 0.5) * 50)]));
  const hist = [];
  for (let age = 10; age <= 18; age++) {
    hist.push({ age, ...p });
    p = Object.fromEntries(PERSONALITY.map(ax => [ax.id, clamp(p[ax.id] + Math.round((r() - 0.5) * 20 + (def.pers?.[ax.id] ?? 0) * 16), -100, 100)]));
  }
  const others = ENDINGS.filter(e => e.id !== def.id && !e.hidden);
  const ru = others[Math.floor(r() * others.length)];
  const score = Math.round(700 + r() * 700);
  return {
    seed: 7000 + i, name: NAMES[i % NAMES.length], guardian: GUARDS[i % GUARDS.length], playthrough: i + 1,
    stats, trust: Math.round(30 + r() * 65), stress: 20,
    counters: { refusals: Math.floor(r() * 14), forced: Math.floor(r() * 8), persuaded: Math.floor(r() * 6), autonomy: Math.floor(r() * 40), events: 60 + Math.floor(r() * 50), months: 96, collapses: Math.floor(r() * 3), adventures: Math.floor(r() * 15) },
    persHistory: hist,
    ending: { id: def.id, name: def.name, cat: def.cat, hidden: !!def.hidden, runnerUp: { id: ru.id, name: ru.name }, top: [{ id: def.id, name: def.name, score }, { id: ru.id, name: ru.name, score: score - 90 }], persHistory: hist },
  };
}
const byId = (id) => ENDINGS.find(e => e.id === id);
const PLAN = {
  empty: [],
  few: ['herb_doctor', 'queen', 'herb_doctor'],
  many: ['herb_doctor', 'queen', 'mercenary_king', 'painter', 'herb_doctor', 'merchant_lord', 'saint', 'star_goddess', 'archmage', 'chef', 'queen', 'drifter',
         'swindler', 'writer', 'farm_owner', 'royal_scholar', 'mercenary_king', 'innkeeper', 'family_home', 'court_musician', 'archbishop', 'guard_captain', 'alchemist', 'queen'],
};
function isoDay(n) { return new Date(Date.UTC(2026, 5, 1) + n * 4 * 86400000).toISOString(); }

let meta, album, extras, last = null;
function build(sc) {
  meta = M.emptyMeta();
  (PLAN[sc] || []).map(byId).filter(Boolean).forEach((def, i) => {
    last = M.recordRun(meta, fakeFinal(i, def), isoDay(i), src());
    meta = last.meta;
  });
  // 상점에서 몇 개 사 둔 상태로 (많은 기록 시나리오)
  if (sc === 'many') for (const id of ['purse', 'seed_mind', 'keepsake']) { const r = M.buyBonus(meta, id); if (r.ok) meta = r.meta; }
  M.saveMeta(storage, meta);
  meta = M.loadMeta(storage);
  document.querySelectorAll('[data-sc]').forEach(b => b.classList.toggle('on', b.dataset.sc === sc));
  mount();
}
function mount(tab) {
  const prevTab = tab ?? q.get('tab') ?? 'album';
  album?.destroy();
  album = renderAlbum(document.getElementById('album'), meta, { tab: prevTab, ...src(), onChange: (m) => { meta = m; M.saveMeta(storage, m); mountExtras(); }, onClose: () => alert('onClose 호출됨') });
  mountExtras();
  document.getElementById('last').textContent = last ? JSON.stringify({ ...last, meta: undefined, run: last.run && { ...last.run, persHistory: `[${last.run.persHistory.length}개]` } }, null, 2) : '-';
  document.getElementById('b-letters').textContent = `편지: ${lettersMode === 'demo' ? '데모' : '실제 데이터'}`;
  const runs = meta.runs;
  document.getElementById('pm-narrow').innerHTML = renderPersonalityMap(runs.length ? runs[runs.length - 1].persHistory : fakeFinal(0, ENDINGS[0]).persHistory, { width: 340 });
}
function mountExtras() {
  extras?.destroy();
  const show = (sel) => { document.getElementById('opts').textContent = JSON.stringify(M.newGameOptions(meta, sel), null, 2); };
  extras = renderNewGameExtras(document.getElementById('extras'), meta, { bonusIds: meta.owned, onChange: show });
  show(extras.getSelection());
}

document.getElementById('bar').addEventListener('click', (ev) => { const b = ev.target.closest('[data-sc]'); if (b) build(b.dataset.sc); });
document.getElementById('b-letters').onclick = () => { lettersMode = lettersMode === 'demo' ? 'data' : 'demo'; mount(); };
document.getElementById('b-corrupt').onclick = () => {
  mem.set(M.META_KEY, '{"v":2,"shards":5,"endings":{"queen":');
  const rep = M.loadMetaReport(storage);
  meta = rep.meta; last = { status: rep.status, backup: mem.get(M.META_BACKUP_KEY) };
  mount();
};
document.getElementById('b-engine').onclick = async () => {
  const btn = document.getElementById('b-engine'); btn.disabled = true;
  try {
    const E = await import('../js/engine/engine.js');
    const opts = M.newGameOptions(meta, extras.getSelection());
    const s = E.newGame({ name: NAMES[meta.totalRuns % NAMES.length], seed: 1000 + meta.totalRuns, ...opts });
    let m = 0;
    while (!s.finished) {
      let slots = ['school', 'farm', m % 3 === 0 ? 'rest' : 'autonomy'];
      for (const p of E.checkRefusals(s, slots)) slots[p.slot] = E.resolveRefusal(s, p, 'persuade').finalActivity;
      E.runMonth(s, slots);
      while (s.pendingEvents.length) { const ev = E.currentEvent(s); if (!ev.choices.length) { s.pendingEvents.shift(); continue; } E.chooseEvent(s, ev.id, ev.choices[0].index); }
      E.endMonth(s); m++;
    }
    last = M.recordRun(meta, s, new Date().toISOString(), src());
    meta = last.meta; M.saveMeta(storage, meta);
    mount();
  } catch (e) { document.getElementById('last').textContent = '엔진 실행 실패: ' + e.message; }
  btn.disabled = false;
};
window.__lab = { M, get meta() { return meta; }, build, mount, storage };
build(q.get('scenario') || 'many');
</script>
</body>
</html>
